<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Life on Land</title>
</head>
<body>
  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
      <div id="hero-carousel" class="carousel slide carousel-fade">
        <div class="carousel-inner">
          <div class="carousel-item active c-item">
            <img src="pic/tree.jpg" class="d-block w-100 c-img" alt="image 1">
            <div class="carousel-caption d-none d-md-block">
              <h5>Tree</h5>
              <p>Some representative placeholder content for the second slide.</p>
            </div>
          </div>
          <div class="carousel-item c-item">
            <img src="pic/tree1.jpg" class="d-block w-100 c-img" alt="image 2">
            <div class="carousel-caption d-none d-md-block">
              <h5>animals</h5>
              <p>Some representative placeholder content for the second slide.</p>
            </div>
          </div>
          <div class="carousel-item c-item">
            <img src="pic/tree3.jpg" class="d-block w-100 c-img" alt="img 3">
            <div class="carousel-caption d-none d-md-block">
              <h5>Humans</h5>
              <p>Some representative placeholder content for the second slide.</p>
            </div>
          </div>
        </div>
        <div class="container">
          <div class="row">
            <div class="col align-self-start">
              <img src="pic/samplingTree.png" class="img-thumbnail" alt="img/png">
            </div>
            <div class="col align-self-center">
              <img src="pic/animals.jpg" class="img-thumbnail" alt="img/jpg">
            </div>
            <div class="col align-self-end">
              <img src="pic/humans.jpg"class="img-thumbnail"  alt="img/jpg">
            </div>
          </div>
        </div>
        
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
